<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos da Equipe</title>

</head>
<body>

  <div class="app-container">

    <!-- Cabeçalho Centralizado -->
    <header>
      <h1>Portfólio de Projetos</h1>
      <p>Projetos e aplicações desenvolvidas pela equipe</p>
    </header>

    <!-- Quadro / Painel Central -->
    <main class="main-panel">

      <!-- Busca Centralizada (Sem botões de filtro)
      <div class="search-wrapper">
        <input type="text" class="search-input" placeholder="Buscar projeto por nome...">   Barra de pesquisa
        <button>Buscar</button>
      </div>
      -->

      <!-- Container do Card Único -->
      <div class="cards-wrapper">
        <article class="project-card">

          <div class="card-body">
            <div class="card-header">
              <h2 class="card-title">Quadro Kanban</h2>
            </div>
            <p class="card-description">
              Aplicação web para gerenciamento e organização de tarefas em formato Kanban.
            </p>

            <div class="card-actions">
              <a href="#" class="btn btn-primary">Acessar</a>
            </div>
          </div>
        </article>
      </div>

    </main>

  </div>

</body>
</html>
