<div class="app-container">

  <!-- Cabeçalho Centralizado com Identidade Equipe Rocket -->
  <header class="rocket-header">
    <div class="logo-wrapper">
      <img src="equipe-rocket-logo.jpg" alt="Logo Equipe Rocket" class="rocket-logo" />
      <div class="logo-glow"></div>
    </div>
    <div class="brand-titles">
      <span class="team-tag">Prepare for trouble • Make it double</span>
      <h1 class="rocket-title"><span class="r-letter">EQUIPE</span> ROCKET</h1>
      <p class="rocket-subtitle">Centro de Comando & Portfólio de Projetos</p>
    </div>
  </header>

  <!-- Quadro / Painel Central -->
  <main class="main-panel">
    <div class="panel-header">
      <span class="panel-badge">Operações Ativas</span>
      <h2>Aplicações da Equipe</h2>

    <!-- Container do Card Único -->
    <div class="cards-wrapper">

        <div class="card-banner">
          <div class="banner-badge">KANBAN</div>

        </div>

        <div class="card-body">
          <div class="card-header">
            <h3 class="card-title">Quadro Kanban</h3>
            <span class="status-badge">Em Produção</span>
          </div>
          <p class="card-description">
            Painel tático para gerenciamento e organização de missões e tarefas em tempo real.
          </p>

          <div class="card-actions">
            <a routerLink="/projetos/1" class="btn btn-primary">
              <span>Acessar Quadro</span>
              <span class="btn-arrow">→</span>
            </a>
          </div>
        </div>
      </article>
    </div>
