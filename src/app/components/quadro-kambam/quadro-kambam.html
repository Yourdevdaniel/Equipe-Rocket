<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Kanban com Filtros</title>
    <!-- Fonte Inter via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho Principal -->
        <header class="app-header active">
            <div class="header-top">
                <div class="header-title">
                    <h1><span id="icon-Equipe"></span>Quadro Kanban</h1>
                    <p class="subtitle">Gerenciamento Tarefas e Projetos</p>
                </div>
                <div class="header-actions">
                    <a routerLink="/projetos" class="btn btn-secondary">← Voltar</a>
                    <button class="btn btn-primary">
                        <span>+</span> Nova Tarefa
                    </button>
                </div>
            </div>

            <!-- Navbar / Barra de Filtros -->
            <div id="filter-navbar">
                <!-- Filtro por Título -->
                <div class="filter-group search-group">
                    <label class="filter-label" for="searchInput">Título:</label>
                    <div class="search-input-box">
                        <input type="text" id="pesquisa" placeholder="Buscar por título...">
                        <button type="button" class="btn btn-search">Pesquisar</button>
                    </div>
                </div>

                <!-- Filtro por Estado (Radio Buttons) -->
                <div class="filter-group">
                    <span class="filter-label">Estado:</span>
                    <div class="radio-group" id="statusFilterGroup">
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="all" checked>
                            <span>Todos</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="todo">
                            <span>A Fazer</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="in-progress">
                            <span>Em Andamento</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="review">
                            <span>Em Revisão</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="done">
                            <span>Concluído</span>
                        </label>
                    </div>
                </div>

                <!-- Filtro por Prioridade (Radio Buttons) -->
                <div class="filter-group">
                    <span class="filter-label">Prioridade:</span>
                    <div class="radio-group" id="priorityFilterGroup">
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="all" checked>
                            <span>Todos</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="baixa">
                            <span>Baixa</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="media">
                            <span>Média</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="alta">
                            <span>Alta</span>
                        </label>
                    </div>
                </div>

                <!-- Botão Limpar Filtros -->
                <div class="filter-group action-group">
                    <button type="button" class="btn btn-clear">Limpar Filtros</button>
                </div>
            </div>




        </header>

        <!-- Quadro Kanban -->
        <main class="kanban-board">
            <!-- Coluna: A Fazer -->
            <div class="kanban-column" id="col-todo" data-status="todo">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-todo"></span>
                        <h2>A Fazer</h2>
                        <!--<span class="task-count" id="contador-a-fazer">0</span> -->  <!--Contador-->
                    </div>


                  <!--  <button class="btn-icon" title="Adicionar nesta coluna">+</button>  botao de adicionar-->


                  </div>

                <!-- Cards a fazer -->
                <div class="task-list">
                  <ul id="list-a-fazer">

                  </ul>
                </div>
            </div>

            <!-- Coluna: Em Progresso -->
            <div class="kanban-column" id="col-in-progress" data-status="in-progress">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-in-progress"></span>
                        <h2>Em Andamento</h2>
                        <!--<span class="task-count" id="contador-progresso">0</span> -->  <!--Contador-->
                    </div>
                        <!--  <button class="btn-icon" title="Adicionar nesta coluna">+</button>  botao de adicionar-->

                </div>

                <!-- Cards em progresso -->
                <div class="task-list">
                  <ul id="list-em-progresso">

                  </ul>
                </div>
            </div>

            <!-- Coluna: Em Revisão -->
            <div class="kanban-column" id="col-review" data-status="review">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-review"></span>
                        <h2>Em Revisão</h2>
                        <!--<span class="task-count" id="contador-em-revisao">0</span> -->  <!--Contador-->
                    </div>
                        <!--  <button class="btn-icon" title="Adicionar nesta coluna">+</button>  botao de adicionar-->

                </div>

                <!-- Cards em revisao -->
                <div class="task-list">
                  <ul id="list-em-revisao">

                  </ul>
                </div>
            </div>

            <!-- Coluna: Concluído -->
            <div class="kanban-column" id="col-done" data-status="done">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-done"></span>
                        <h2>Concluído</h2>
                        <!--<span class="task-count" id="contador-concluido">0</span> -->  <!--Contador-->
                    </div>
                        <!--  <button class="btn-icon" title="Adicionar nesta coluna">+</button>  botao de adicionar-->

                </div>

                <!-- Cards concluido -->
                <div class="task-list">
                  <ul id="list-concluido">

                  </ul>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
