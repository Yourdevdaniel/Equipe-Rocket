<div class="barra">
  <div class="campo">
    <label for="filtro-busca">Título</label>
    <input
      id="filtro-busca"
      type="search"
      placeholder="Buscar por título..."
      [value]="filtros.busca()"
      (input)="filtros.busca.set($any($event.target).value)"
    />
  </div>

  <div class="campo">
    <label for="filtro-status">Status</label>
    <select id="filtro-status" [value]="filtros.status()" (change)="definirStatus($any($event.target).value)">
      <option value="todos">Todos</option>
      <option value="a-fazer">A Fazer</option>
      <option value="em-andamento">Em Andamento</option>
      <option value="em-revisao">Em Revisão</option>
      <option value="concluida">Concluído</option>
    </select>
  </div>

  <div class="campo">
    <label for="filtro-prioridade">Prioridade</label>
    <select id="filtro-prioridade" [value]="filtros.prioridade()" (change)="definirPrioridade($any($event.target).value)">
      <option value="todas">Todas</option>
      <option value="alta">Alta</option>
      <option value="media">Média</option>
      <option value="baixa">Baixa</option>
    </select>
  </div>

  <button type="button" class="btn-limpar" (click)="filtros.limpar()">Limpar filtros</button>
</div>
