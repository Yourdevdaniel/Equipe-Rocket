<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Kanban com Filtros</title>
    <!-- Fonte Inter via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho Principal -->
        <header class="app-header">
            <div class="header-top">
                <div class="header-title">
                    <h1>📋 Quadro Kanban</h1>
                    <p class="subtitle">Gerenciamento ágil de tarefas e projetos</p>
                </div>
                <button class="btn btn-primary">
                    <span>+</span> Nova Tarefa
                </button>
            </div>

            <!-- Navbar / Barra de Filtros -->
            <div id="filter-navbar">
                <!-- Filtro por Título -->
                <div class="filter-group search-group">
                    <label class="filter-label" for="searchInput">Título:</label>
                    <div class="search-input-box">
                        <input type="text" id="searchInput" placeholder="Buscar por título..." onkeydown="handleSearchKeyDown(event)">
                        <button type="button" class="btn btn-search">🔍 Pesquisar</button>
                    </div>
                </div>

                <!-- Filtro por Estado (Radio Buttons) -->
                <div class="filter-group">
                    <span class="filter-label">Estado:</span>
                    <div class="radio-group" id="statusFilterGroup">
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="all" checked onchange="applyFilters()">
                            <span>Todos</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="todo" onchange="applyFilters()">
                            <span>A Fazer</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="in-progress" onchange="applyFilters()">
                            <span>Em Andamento</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="review" onchange="applyFilters()">
                            <span>Em Revisão</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="statusFilter" value="done" onchange="applyFilters()">
                            <span>Concluído</span>
                        </label>
                    </div>
                </div>

                <!-- Filtro por Prioridade (Radio Buttons) -->
                <div class="filter-group">
                    <span class="filter-label">Prioridade:</span>
                    <div class="radio-group" id="priorityFilterGroup">
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="all" checked onchange="applyFilters()">
                            <span>Todos</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="baixa" onchange="applyFilters()">
                            <span>Baixa</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="media" onchange="applyFilters()">
                            <span>Média</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="priorityFilter" value="alta" onchange="applyFilters()">
                            <span>Alta</span>
                        </label>
                    </div>
                </div>

                <!-- Botão Limpar Filtros -->
                <div class="filter-group action-group">
                    <button type="button" class="btn btn-clear">🧹 Limpar Filtros</button>
                </div>
            </div>


        </header>

        <!-- Quadro Kanban -->
        <main class="kanban-board">
            <!-- Coluna: A Fazer -->
            <div class="kanban-column" id="col-todo" data-status="todo">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-todo"></span>
                        <h2>A Fazer</h2>
                        <span class="task-count" id="count-todo">0</span>
                    </div>
                    <button class="btn-icon" title="Adicionar nesta coluna">+</button>
                </div>
                <div class="task-list" id="list-todo" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'todo')">
                </div>
            </div>

            <!-- Coluna: Em Progresso -->
            <div class="kanban-column" id="col-in-progress" data-status="in-progress">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-in-progress"></span>
                        <h2>Em Andamento</h2>
                        <span class="task-count" id="count-in-progress">0</span>
                    </div>
                    <button class="btn-icon" title="Adicionar nesta coluna">+</button>
                </div>
                <div class="task-list" id="list-in-progress" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'in-progress')">
                </div>
            </div>

            <!-- Coluna: Em Revisão -->
            <div class="kanban-column" id="col-review" data-status="review">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-review"></span>
                        <h2>Em Revisão</h2>
                        <span class="task-count" id="count-review">0</span>
                    </div>
                    <button class="btn-icon" title="Adicionar nesta coluna">+</button>
                </div>
                <div class="task-list" id="list-review" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'review')">
                </div>
            </div>

            <!-- Coluna: Concluído -->
            <div class="kanban-column" id="col-done" data-status="done">
                <div class="column-header">
                    <div class="column-title">
                        <span class="status-indicator status-done"></span>
                        <h2>Concluído</h2>
                        <span class="task-count" id="count-done">0</span>
                    </div>
                    <button class="btn-icon" title="Adicionar nesta coluna">+</button>
                </div>
                <div class="task-list" id="list-done" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'done')">
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Criar/Editar Tarefa -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nova Tarefa</h3>
                <button class="btn-close">&times;</button>
            </div>
            <form id="taskForm" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">

                <div class="form-group">
                    <label for="taskTitle">Título da Tarefa *</label>
                    <input type="text" id="taskTitle" required placeholder="Ex: Criar página de login">
                </div>

                <div class="form-group">
                    <label for="taskDescription">Descrição</label>
                    <textarea id="taskDescription" rows="3" placeholder="Detalhes da tarefa..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatus">Coluna / Estado</label>
                        <select id="taskStatus">
                            <option value="todo">A Fazer</option>
                            <option value="in-progress">Em Andamento</option>
                            <option value="review">Em Revisão</option>
                            <option value="done">Concluído</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Prioridade</label>
                        <select id="taskPriority">
                            <option value="baixa">Baixa</option>
                            <option value="media" selected>Média</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">Categoria / Tag</label>
                        <input type="text" id="taskCategory" placeholder="Ex: Frontend, Design, Backend">
                    </div>

                    <div class="form-group">
                        <label for="taskDueDate">Data de Entrega</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
